     調性＝小狐狸一起出征打壞狐狸。排法學她給的參考圖（斜切的格子、對白泡泡、一格一格開），圖先用現有的 3D 關主（名帖頁 __card.snap 拍的透明底）。

     單一檔案＋comic/ 資料夾的圖（b0～b8 關主、h0～h5 小狐狸、team 隊伍）。對白都是暫時的。 -->

<style>
:root{--ink:#1d1430;--paper:#fff6e4;--gold:#ffcf4a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1d1430;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:900;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle,rgba(255,255,255,.07) 1.3px,transparent 1.8px) 0 0/14px 14px,linear-gradient(#241a40,#3a2a66);overflow-x:hidden}
#top{text-align:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 6px}
#top h1{margin:0;font-size:clamp(26px,6.4vmin,46px);letter-spacing:.12em;color:var(--gold);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg)}
#top p{margin:8px 0 0;font-size:13px;font-weight:700;color:#e9dcff;letter-spacing:.08em}#top p b{color:var(--gold)}
#book{display:flex;gap:16px;justify-content:center;align-items:flex-start;padding:10px 12px 86px;flex-wrap:wrap}
.page{position:relative;width:min(94vw,56vh,520px);aspect-ratio:3/4.1;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:7px 8px 0 rgba(0,0,0,.4);padding:9px;display:flex;flex-direction:column;gap:8px}
.page::after{content:attr(data-no);position:absolute;right:10px;bottom:-1px;font-size:10px;color:#8a7a9a;transform:translateY(100%);padding-top:3px;color:#cdbdf0}
.row{position:relative;flex:1;min-height:0}.row.big{flex:1.25}
/* 一格＝外面一層畫墨線（四個方向的陰影疊出描邊）、裡面一層照斜邊裁切 */
.pw{position:absolute;top:0;height:100%;filter:drop-shadow(2.5px 0 0 var(--ink)) drop-shadow(-2.5px 0 0 var(--ink)) drop-shadow(0 2.5px 0 var(--ink)) drop-shadow(0 -2.5px 0 var(--ink));cursor:default;transition:transform .15s}
.pw.full{left:0;width:100%}
.row.s1 .pw.l{left:0;width:57%}.row.s1 .pw.r{left:47%;width:53%}.row.s1 .pw.l .panel{clip-path:polygon(0 0,100% 0,79% 100%,0 100%)}.row.s1 .pw.r .panel{clip-path:polygon(24% 0,100% 0,100% 100%,0 100%)}
.row.s2 .pw.l{left:0;width:57%}.row.s2 .pw.r{left:47%;width:53%}.row.s2 .pw.l .panel{clip-path:polygon(0 0,79% 0,100% 100%,0 100%)}.row.s2 .pw.r .panel{clip-path:polygon(0 0,100% 0,100% 100%,24% 100%)}
.panel{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle,rgba(255,255,255,.34) 1.3px,transparent 1.8px) 0 0/9px 9px,linear-gradient(160deg,var(--c1),var(--c2))}
.panel .rays{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.26) 0 4deg,transparent 4deg 13deg);-webkit-mask:radial-gradient(circle at 50% 62%,transparent 0 24%,#000 62%);mask:radial-gradient(circle at 50% 62%,transparent 0 24%,#000 62%)}
.panel .boss{position:absolute;left:var(--bx,50%);bottom:3%;height:66%;transform:translateX(-50%);filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(0 5px 0 rgba(29,20,48,.35));pointer-events:none;user-select:none}
.bubble{position:absolute;top:7%;max-width:62%;padding:.5em .75em;background:#fff;border:2.5px solid var(--ink);border-radius:1.2em;font-size:clamp(10.5px,2.5vmin,15px);line-height:1.35;letter-spacing:.03em;box-shadow:3px 3px 0 var(--ink);z-index:2}
.bubble::after{content:"";position:absolute;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(14deg,14deg)}
.pw.l .bubble,.pw.full .bubble{left:5%}.pw.l .bubble::after,.pw.full .bubble::after{right:22%}
.pw.r .bubble{right:5%}.pw.r .bubble::after{left:22%}
.pw.l .bubble,.pw.r .bubble{max-width:54%}.pw.full .bubble{max-width:46%}
.tag{position:absolute;bottom:5%;padding:.25em .7em;background:var(--ink);color:#fff;font-size:clamp(9.5px,2.2vmin,13px);letter-spacing:.14em;border-radius:3px;transform:rotate(-3deg);z-index:2}
.pw.l .tag,.pw.full .tag{left:4%}.pw.r .tag{right:4%}
.hero{position:absolute;width:23%;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);background:#243070 center/cover;box-shadow:2px 3px 0 var(--ink);z-index:2}
.pw.l .hero,.pw.full .hero{left:4%;bottom:21%}.pw.r .hero{right:4%;bottom:21%}.pw.l .hero,.pw.r .hero{width:19%}.pw.full .hero{width:13%;bottom:24%}
.pw.r .hero i{left:auto;right:62%}
.hero i{position:absolute;left:62%;top:-.9em;transform:rotate(-4deg);white-space:nowrap;font-style:normal;font-size:clamp(9px,2vmin,12px);padding:.15em .55em;background:var(--gold);border:2px solid var(--ink);border-radius:999px}
.stamp{position:absolute;bottom:7%;width:21%;aspect-ratio:1;border-radius:50%;border:3px solid #e0323c;color:#e0323c;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,2.9vmin,18px);letter-spacing:.06em;transform:rotate(-16deg);background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #e0323c;z-index:3}
.row.s1 .pw.l .stamp{right:25%}.row.s2 .pw.l .stamp{right:6%}.row.s1 .pw.r .stamp{left:6%}.row.s2 .pw.r .stamp{left:27%}.pw.full .stamp{right:5%;width:15%}.pw.full .boss{height:82%}
.sfx{position:absolute;left:50%;top:44%;font-size:clamp(30px,9vmin,64px);color:var(--gold);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%) rotate(-10deg) scale(0);opacity:0;z-index:4;pointer-events:none;white-space:nowrap}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
.q{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:clamp(34px,11vmin,70px);color:rgba(255,255,255,.75);-webkit-text-stroke:5px rgba(29,20,48,.55);paint-order:stroke fill;z-index:2;display:none}
.no{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:clamp(9.5px,2.2vmin,13px);letter-spacing:.2em;color:#fff;background:rgba(29,20,48,.7);padding:.2em .8em;border-radius:999px;z-index:2;display:none;white-space:nowrap}
/* 還沒開的格子：灰色網點、關主只剩剪影、一個大問號 */
.pw.lock .panel,.pw.next .panel{background:radial-gradient(circle,rgba(255,255,255,.18) 1.3px,transparent 1.8px) 0 0/9px 9px,linear-gradient(160deg,#77708c,#4a4460)}
.pw.lock .boss,.pw.next .boss{filter:brightness(0);opacity:.32}
.pw.lock .rays,.pw.lock .bubble,.pw.lock .tag,.pw.lock .hero,.pw.lock .stamp,.pw.next .rays,.pw.next .bubble,.pw.next .tag,.pw.next .stamp,.pw.lock .team,.pw.next .team{display:none}
.pw.lock .q,.pw.lock .no,.pw.next .q,.pw.next .no{display:block}
/* 下一格（可以打的）：金色發亮、小狐狸在旁邊跳、寫「點我出征！」 */
.pw.next{cursor:pointer;animation:nextGlow 1s ease-in-out infinite alternate;z-index:3}
@keyframes nextGlow{from{filter:drop-shadow(2.5px 0 0 var(--ink)) drop-shadow(-2.5px 0 0 var(--ink)) drop-shadow(0 2.5px 0 var(--ink)) drop-shadow(0 -2.5px 0 var(--ink)) drop-shadow(0 0 3px #ffcf4a)}to{filter:drop-shadow(2.5px 0 0 var(--ink)) drop-shadow(-2.5px 0 0 var(--ink)) drop-shadow(0 2.5px 0 var(--ink)) drop-shadow(0 -2.5px 0 var(--ink)) drop-shadow(0 0 14px #ffcf4a)}}
.pw.next .panel{background:radial-gradient(circle,rgba(255,255,255,.22) 1.3px,transparent 1.8px) 0 0/9px 9px,linear-gradient(160deg,#8d86a8,#5a5378)}
.pw.next .no{background:var(--gold);color:var(--ink);border:2px solid var(--ink);animation:bob .5s ease-in-out infinite alternate}
.pw.next .hero{animation:bob .42s ease-in-out infinite alternate}.pw.next .hero i{display:none}
@keyframes bob{from{translate:0 0}to{translate:0 -7px}}
.pw.next:active{transform:scale(.98)}
/* 打贏的那一下 */
.pw.pop .flash{animation:fl .4s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}
.pw.pop .boss{animation:bossPop .7s cubic-bezier(.2,1.7,.4,1)}@keyframes bossPop{0%{transform:translateX(-50%) scale(.55) rotate(-8deg)}55%{transform:translateX(-50%) scale(1.14) rotate(4deg)}100%{transform:translateX(-50%) scale(1) rotate(0)}}
.pw.pop .sfx{animation:sfx 1s cubic-bezier(.2,1.8,.4,1)}@keyframes sfx{0%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(0)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1.25)}30%{transform:translate(-50%,-50%) rotate(-10deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) rotate(-10deg) scale(1.05)}}
.pw.pop .stamp{animation:stamp .5s .42s cubic-bezier(.3,1.5,.5,1) both}@keyframes stamp{0%{opacity:0;transform:rotate(-16deg) scale(3)}60%{opacity:1;transform:rotate(-16deg) scale(.92)}100%{opacity:1;transform:rotate(-16deg) scale(1)}}
.pw.pop .bubble{animation:bub .4s .7s cubic-bezier(.2,1.8,.4,1) both}@keyframes bub{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
.pw.pop .hero{animation:bub .4s .85s cubic-bezier(.2,1.8,.4,1) both}
.page.shake{animation:shake .32s}@keyframes shake{0%,100%{transform:none}25%{transform:translate(-5px,3px) rotate(-.4deg)}50%{transform:translate(5px,-3px) rotate(.4deg)}75%{transform:translate(-3px,-2px)}}
/* 最後一格：大合照 */
.team{position:absolute;left:14%;right:14%;bottom:17%;height:36%;background:#141a3c center/cover no-repeat;border:5px solid #fff;outline:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink);transform:rotate(-2.5deg);z-index:1}   /* 大合照：一張拍立得 */
.fin .bossrow{position:absolute;left:0;right:0;top:4%;height:40%;display:flex;justify-content:center;align-items:flex-end;gap:0}
.fin .bossrow img{height:78%;margin:0 -3.2%;filter:drop-shadow(0 4px 0 rgba(29,20,48,.3))}.fin .bossrow img:nth-child(odd){height:96%}
.pw.lock .bossrow img,.pw.next .bossrow img{filter:brightness(0);opacity:.3}
.pw.fin .bubble{top:auto;bottom:4%;left:50%;right:auto;transform:translateX(-50%);max-width:80%;white-space:nowrap;z-index:3}.fin .bubble::after{display:none}
.pw.pop.fin .bubble{animation:bubC .4s .7s cubic-bezier(.2,1.8,.4,1) both}@keyframes bubC{0%{opacity:0;transform:translateX(-50%) scale(.3)}100%{opacity:1;transform:translateX(-50%)}}
#end{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-4deg) scale(0);font-size:clamp(40px,13vmin,96px);color:var(--gold);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);z-index:20;pointer-events:none;white-space:nowrap}
#end.on{animation:endPop 2.4s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes endPop{0%{transform:translate(-50%,-50%) rotate(-4deg) scale(0)}12%{transform:translate(-50%,-50%) rotate(-4deg) scale(1.15)}20%,80%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:0}}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:19;pointer-events:none;animation:cf linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:9px 10px calc(env(safe-area-inset-bottom,0px) + 9px);background:rgba(29,20,48,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:15;font-weight:700;font-size:12px;color:#e9dcff}
#bar button{font:900 13px "Noto Sans TC",sans-serif;padding:7px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #000;cursor:pointer}
#bar button.g{background:#e9dcff}
</style>

<body>
<div id="top"><h1>狐仙出征！</h1><p>試看頁：點<b>發亮的那一格</b>＝假裝打贏。已經開了 <b id="cnt">0</b>／10 格</p></div>
<div id="book"></div>
<div id="end">完結！</div>
<div id="bar"><span>試看工具</span><button type="button" id="next1">打贏下一格</button><button type="button" class="g" id="all">全部打開</button><button type="button" class="g" id="reset">重來</button></div>
<script>
