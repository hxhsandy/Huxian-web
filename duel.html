<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>狐仙對戰 雙畫面（試看）</title>
<!-- 狐仙對戰的「殼」（2026-11-13 遊星；約定在 docs/09b_versus_link.md）：同一頁並排兩個遊戲畫面（兩個 iframe，各跑一份 versus.html），
     殼負責排版、在兩邊之間轉訊息、當裁判（時間、勝負）。單一檔案、不用組建；放在網站上 versus.html 的旁邊。
     網址參數：?a=0～8 我的狐狸長相（預設 3）　&b=0～8 對手（預設 4）　&lv=1｜2｜3 右邊電腦的難度（預設 2）　&game=遊戲檔名（預設 versus.html）　&lag=毫秒（轉訊息時故意慢，模擬網路）
     開發用：&la=1｜2｜3 左邊也讓電腦下　&hp=雙方的血（試短的場次）　&gb=combo｜move　&def=JSON（換 VS_DEF 的數字，兩邊一起）　&kotest 中間多一顆「試 KO」 -->
<style>
html,body{margin:0;height:100%;background:#05060c;color:#fff8ec;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;overflow:hidden}
#duel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:0}
.panel{position:relative;flex:none;border-radius:14px;box-shadow:0 0 0 2px #2a3157,0 10px 40px rgba(0,0,0,.6);background:#0b1330}
.panel iframe{display:block;width:100%;height:100%;border:0;border-radius:14px}.panel .dim{border-radius:14px}
.panel .tag{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;letter-spacing:.3em;opacity:.55;pointer-events:none}
#pb::after{content:"";position:absolute;inset:0;z-index:1}.panel .dim,.panel .koT,.panel .plus{z-index:2}   /* 右邊那份不給點（對手的畫面只能看） */
#mid{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#clock{font:900 34px "Noto Serif HK","Noto Serif TC",serif;letter-spacing:.04em;color:#fff3d0;text-shadow:0 0 14px #ffb84a}
#clock.rage{color:#ff8a6a;text-shadow:0 0 16px #ff4a2a}
.kos{display:flex;gap:5px;justify-content:center}.kos i{width:13px;height:13px;transform:rotate(45deg);background:#2a3157;border:1.5px solid #8a93c4}
.kos i.on{background:#ffcf6a;border-color:#fff3d0;box-shadow:0 0 8px #ffb84a}
.who{font-size:12px;letter-spacing:.2em;opacity:.8}
#vsMark{font:italic 900 46px "Noto Serif HK",serif;color:#ffd978;text-shadow:0 0 18px #f08a2c,0 3px 0 #7a3b10}
#msg{position:absolute;left:0;right:0;top:42%;text-align:center;font:900 64px "Noto Serif HK","Noto Serif TC",serif;color:#fff6dc;text-shadow:0 0 24px #ffb84a,0 4px 0 #7a3b10;pointer-events:none;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
.panel .dim{position:absolute;inset:0;background:rgba(4,5,14,.58);opacity:0;pointer-events:none;transition:opacity .15s}
.panel.koed .dim{opacity:1}
.panel .koT{position:absolute;left:50%;top:46%;font:italic 900 calc(var(--pw)*0.36) "Noto Serif HK","Noto Serif TC",serif;color:#fff3d0;text-shadow:0 0 calc(var(--pw)*0.075) #ff7a2a,0 calc(var(--pw)*0.015) 0 #7a1b10,0 0 4px #000;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;white-space:nowrap;letter-spacing:.04em}
#pa .koT{color:#ffd0c8;text-shadow:0 0 calc(var(--pw)*0.075) #ff2a2a,0 calc(var(--pw)*0.015) 0 #5a0b10,0 0 4px #000}   /* 我被 KO：偏紅；我 KO 她：金色 */
.panel.koed .koT{animation:koPop 1.25s cubic-bezier(.2,1.5,.4,1)}
@keyframes koPop{0%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-9deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}20%{transform:translate(-50%,-50%) scale(1.12) rotate(-9deg)}27%{transform:translate(-50%,-50%) scale(1) rotate(-9deg)}82%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2) rotate(-9deg)}}
.panel .plus{position:absolute;left:0;right:0;top:27%;text-align:center;font:italic 900 calc(var(--pw)*0.17) "Noto Serif HK","Noto Serif TC",serif;color:#fff3d0;text-shadow:0 0 calc(var(--pw)*0.05) #ffb84a,0 calc(var(--pw)*0.008) 0 #7a3b10;opacity:0;pointer-events:none;letter-spacing:.04em}
.panel .plus::before{content:"";display:inline-block;width:.42em;height:.42em;margin-right:.32em;transform:rotate(45deg) translateY(-.08em);background:#ffcf6a;border:.04em solid #fff3d0;box-shadow:0 0 .35em #ffb84a}   /* KO 寶石的小菱形 */
.panel.kowin .plus{animation:plusPop 1.25s cubic-bezier(.2,1.6,.4,1)}
@keyframes plusPop{0%{opacity:0;transform:translateY(30%) scale(.6)}18%{opacity:1;transform:translateY(0) scale(1.12)}28%{transform:translateY(0) scale(1)}75%{opacity:1;transform:translateY(-12%) scale(1)}100%{opacity:0;transform:translateY(-40%) scale(1)}}
#duel.shake{animation:duelShake .35s}
@keyframes duelShake{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,2px)}}
.panel .who2{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);padding:3px 16px 4px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.3em;text-indent:.3em;white-space:nowrap;z-index:3;pointer-events:none}
#pa{box-shadow:0 0 0 2.5px #f3d9a0,0 0 26px rgba(255,190,90,.55),0 10px 40px rgba(0,0,0,.6)}   /* 我的畫面：金框發光（2026-11-13 CK：第一次玩會不知道哪一個版面是我的） */
#pa .who2{background:linear-gradient(#f6c463,#d98a2b);color:#3a1c05;border:1.5px solid #fff3d0;box-shadow:0 2px 10px rgba(240,150,40,.6)}
#pb .who2{background:#1b2040;color:#c9cfee;border:1.5px solid #55608c}
.panel.dimmed .dim{opacity:1}
.panel .cnt{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:2;pointer-events:none;opacity:0}
.panel .cnt b{display:block;font:900 calc(var(--pw)*0.5) "Noto Serif HK","Noto Serif TC",serif;line-height:1;color:#fff6dc;text-shadow:0 0 calc(var(--pw)*0.08) #ffb84a,0 calc(var(--pw)*0.012) 0 #7a3b10}
.panel .cnt span{display:block;margin-top:calc(var(--pw)*0.05);font:900 calc(var(--pw)*0.085) "Noto Serif TC",serif;letter-spacing:.2em}
#pa .cnt span{color:#ffd978}#pb .cnt span{color:#c9cfee}
.panel .cnt.pop{opacity:1}.panel .cnt.pop b{animation:cntPop .9s ease-out}
@keyframes cntPop{0%{transform:scale(2.2);opacity:0}22%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:1}}
.panel .res{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:2;pointer-events:none;opacity:0;font:900 calc(var(--pw)*0.3) "Noto Serif HK","Noto Serif TC",serif;letter-spacing:.08em;text-indent:.08em;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.panel .res.on{opacity:1;transform:none}
.panel .res.win{color:#fff3d0;text-shadow:0 0 calc(var(--pw)*0.09) #ffb84a,0 0 calc(var(--pw)*0.03) #fff,0 calc(var(--pw)*0.014) 0 #7a3b10}
.panel .res.lose{color:#9aa0b8;text-shadow:0 calc(var(--pw)*0.012) 0 #1a1c2a;font-size:calc(var(--pw)*0.24)}
.panel.won{box-shadow:0 0 0 3px #fff3d0,0 0 60px rgba(255,200,100,.85),0 10px 40px rgba(0,0,0,.6)!important}
.panel .danger{position:absolute;bottom:3%;width:7px;height:40%;border-radius:4px;background:rgba(20,22,40,.85);box-shadow:0 0 0 1px #3a416a;overflow:hidden;z-index:3;pointer-events:none}
#pa .danger{right:-12px}#pb .danger{left:-12px}
.panel .danger i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffd24a,#ff5a2a);box-shadow:0 0 10px #ff6a2a;transition:height .15s}
.panel .danger.hot i{animation:dangerBlink .35s infinite alternate}@keyframes dangerBlink{from{filter:brightness(1)}to{filter:brightness(1.7)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#again{display:none;margin-top:6px;padding:8px 20px;border-radius:999px;border:1.5px solid #f3d9a0;background:linear-gradient(#f6c463,#d98a2b);color:#3a1c05;font:900 15px "Noto Serif TC",serif;letter-spacing:.2em;cursor:pointer}
#note{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:11px sans-serif;opacity:.4}
</style>
</head>
<body>
<div id="duel">
  <div class="panel" id="pa"><iframe id="fa" allow="autoplay"></iframe><div class="dim"></div><div class="cnt"><b></b><span>你的盤面</span></div><div class="res"></div><div class="who2">你</div><div class="danger"><i></i></div><div class="koT">K.O.</div><div class="plus">+1</div></div>
  <div id="mid">
    <div class="who" id="nameB">對手</div><div class="kos" id="koB"></div>
    <div id="clock">3:00</div><div id="vsMark">VS</div>
    <div class="kos" id="koA"></div><div class="who" id="nameA">我</div>
    <button id="again" type="button">再來一局</button>
  </div>
  <div class="panel" id="pb"><iframe id="fb" allow="autoplay"></iframe><div class="dim"></div><div class="cnt"><b></b><span>對手</span></div><div class="res"></div><div class="who2">對手</div><div class="danger"><i></i></div><div class="koT">K.O.</div><div class="plus">+1</div></div>
</div>
<canvas id="fx"></canvas>
<div id="msg"></div>
<div id="note">狐仙對戰・雙畫面試看</div>
<script>
(function(){
var Q=new URLSearchParams(location.search),GAME=Q.get('game')||'versus.html',LAG=+Q.get('lag')||0,
    A=Q.has('a')?+Q.get('a'):3,B=Q.has('b')?+Q.get('b'):4,LV=Q.get('lv')||'2';
var DEF={time:180,koWin:3,rage:[90,120]};   // 殼當裁判用的數字（跟遊戲裡 VS_DEF 一樣；之後從 hello 拿）
var $=function(id){return document.getElementById(id);},pa=$('pa'),pb=$('pb'),fa=$('fa'),fb=$('fb'),mid=$('mid');
// 左邊＝我（台上是對手 B 的長相）；右邊＝對手那一份（台上是我 A 的長相）、電腦下棋、不出聲
var EXTRA=(Q.get('hp')?'&hp='+Q.get('hp'):'')+(Q.get('gb')?'&gb='+Q.get('gb'):'')+(Q.get('def')?'&def='+encodeURIComponent(Q.get('def')):'');   /* 兩份要給一樣的 */
fa.src=GAME+'?versus&link=parent&side=a&foe='+B+(Q.get('la')?'&auto='+Q.get('la'):'')+EXTRA;
fb.src=GAME+'?versus&link=parent&side=b&foe='+A+'&auto='+LV+'&mute=1'+EXTRA;
/* ---------- 排版：兩個 9:16 的畫面照視窗高度縮放，中間留一條；畫面太窄（手機直拿）只留左邊 ---------- */
function layout(){var W=innerWidth,H=innerHeight,narrow=W<H*0.95,midW=narrow?0:Math.max(96,Math.min(170,W*0.11)),
    h=Math.min(H-16,narrow?H:(W-midW-24)/2*16/9),w=Math.round(h*9/16);h=Math.round(h);
  [pa,pb].forEach(function(p){p.style.width=w+'px';p.style.height=h+'px';p.style.setProperty('--pw',w+'px');});
  pb.style.display=mid.style.display=narrow?'none':'';mid.style.width=midW+'px';pa.style.borderRadius=narrow?'0':'';}
addEventListener('resize',layout);layout();
/* ---------- 轉訊息＋當裁判 ---------- */
var COUNT=3,held=0,hidAt=0;   // held：整頁被切到背景的時間（裁判的時鐘那段時間不走）
var side={a:{win:fa,hello:false,st:{ko:0}},b:{win:fb,hello:false,st:{ko:0}}},state='wait',t0=0,linked=false;
function send(k,m){m.vs=1;if(!m.from)m.from='shell';var w=side[k].win.contentWindow;if(w)w.postMessage(m,'*');}
function both(m){send('a',Object.assign({},m));send('b',Object.assign({},m));}
function gems(el,n){var s='';for(var i=0;i<DEF.koWin;i++)s+='<i class="'+(i<DEF.koWin-n?'on':'')+'"></i>';el.innerHTML=s;}   // 亮著的＝還能被 KO 幾次
function draw(){gems($('koA'),side.a.st.ko||0);gems($('koB'),side.b.st.ko||0);}
/* 大大的 KO＋音效（2026-11-13 CK）。聲音用殼自己的（兩聲低鼓＋一聲鑼） */
var AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(_){AC=null;}return AC;}
function tone(f0,f1,dur,vol,type,when){var c=ac();if(!c)return;var t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);}
function koSound(){tone(160,42,0.5,0.5,'sine');tone(90,40,0.6,0.35,'triangle',0.02);tone(620,300,0.9,0.12,'sawtooth',0.1);tone(930,460,0.9,0.07,'square',0.1);}
// 哪邊被 KO 就蓋在哪邊：那個畫面壓暗、蓋一個大大的 KO；另一邊浮一個金色的「◆ +1」（位置照 Tetris Battle，字和顏色照我們自己的風格，2026-11-13 CK）；整頁震一下
function koShow(victim){var v=victim==='a'?pa:pb,w=victim==='a'?pb:pa;[pa,pb].forEach(function(p){p.classList.remove('koed','kowin');});void v.offsetWidth;v.classList.add('koed');w.classList.add('kowin');
  clearTimeout(koShow.t);koShow.t=setTimeout(function(){v.classList.remove('koed');w.classList.remove('kowin');},1250);var d=$('duel');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');koSound();}
function say(s,keep){var m=$('msg');m.textContent=s;m.classList.add('on');if(!keep)setTimeout(function(){m.classList.remove('on');},900);}
// 開始：兩個畫面壓暗、各蓋一個大大的倒數（下面寫「你的盤面／對手」），數完才亮起來（2026-11-13 CK：倒數看不清、第一次玩不知道哪邊是自己）
function start(){state='count';clearResult();both({type:'start',seed:(Math.random()*2147483646)|0,count:COUNT});[pa,pb].forEach(function(p){p.classList.add('dimmed');});
  for(var i=0;i<COUNT;i++)(function(i){setTimeout(function(){if(state!=='count')return;[pa,pb].forEach(function(p){var c=p.querySelector('.cnt');c.querySelector('b').textContent=COUNT-i;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');});tone(520,500,0.12,0.2,'triangle');},i*1000);})(i);
  setTimeout(function(){if(state!=='count')return;state='play';t0=performance.now();held=0;[pa,pb].forEach(function(p){p.classList.remove('dimmed');p.querySelector('.cnt').classList.remove('pop');});tone(780,1040,0.35,0.25,'triangle');},COUNT*1000);}
function clearResult(){[pa,pb].forEach(function(p){p.classList.remove('dimmed','won');var r=p.querySelector('.res');r.className='res';r.textContent='';});}
// 結果：各蓋在自己的畫面上——贏的那邊金色「勝利」＋畫面發光，輸的那邊壓暗＋「落敗」（2026-11-13 CK：打在中間一瞬間搞不清誰贏）
function showResult(winner){[['a',pa],['b',pb]].forEach(function(x){var r=x[1].querySelector('.res'),w=winner===x[0],d=winner==='draw';r.textContent=d?'平手':w?'勝利':'落敗';r.className='res on '+(w?'win':'lose');x[1].classList.toggle('won',w);x[1].classList.toggle('dimmed',!w);});
  if(winner==='a')[0,0.12,0.24,0.4].forEach(function(w,i){tone([523,659,784,1047][i],[523,659,784,1047][i],i===3?0.7:0.16,0.22,'triangle',w);});else if(winner==='b'){tone(330,220,0.5,0.22,'triangle');tone(220,150,0.8,0.2,'triangle',0.35);}}
function over(winner,by){if(state==='over')return;state='over';both({type:'over',winner:winner,by:by});setTimeout(function(){showResult(winner);$('again').style.display='inline-block';},700);}
addEventListener('message',function(ev){var m=ev.data;if(!m||m.vs!==1)return;var k=ev.source===fa.contentWindow?'a':ev.source===fb.contentWindow?'b':null;if(!k)return;
  var o=k==='a'?'b':'a';linked=true;
  if(m.type==='hello'){side[k].hello=true;if(m.card&&m.card.name){$(k==='a'?'nameA':'nameB').textContent=m.card.name;if(k==='b')pb.querySelector('.who2').textContent='對手・'+m.card.name;}if(m.def)Object.assign(DEF,m.def);draw();
    if(side.a.hello&&side.b.hello&&state==='wait')start();return;}
  if(m.type==='st'){side[k].st=m;draw();danger(k,m.pend||0);}
  if(m.type==='geo'){side[k].geo=m;return;}
  if(m.type==='fx'){if(m.kind==='orbs'&&m.pts)fly(k,m.pts);return;}
  if(m.type==='ko'){side[k].st.ko=m.n;draw();koShow(k);if(m.n>=DEF.koWin)setTimeout(function(){over(o,'ko');},LAG+50);}
  setTimeout(function(){send(o,m);},LAG);});
$('again').addEventListener('click',function(){$('again').style.display='none';clearResult();side.a.st={ko:0};side.b.st={ko:0};draw();both({type:'again'});state='wait';setTimeout(start,400);});
var tick=0;document.addEventListener('visibilitychange',function(){if(document.hidden)hidAt=performance.now();else if(hidAt){held+=performance.now()-hidAt;hidAt=0;}});
/* ---------- 危險條：盤面旁邊一條直的，對方送來、還沒落下的干擾越多越滿（Tetris Battle 盤面旁那條紅的） ---------- */
var PEND_MAX=8;function danger(k,n){var d=(k==='a'?pa:pb).querySelector('.danger');d.firstChild.style.height=Math.min(100,n/PEND_MAX*100)+'%';d.classList.toggle('hot',n>=PEND_MAX*0.6);}
/* ---------- 飛過去的光：這一邊消掉的珠子變成同顏色的光點，一串弧線飛到「另一邊畫面台上、自己的狐狸」身上 ---------- */
// 樣子照遊戲裡「珠子消掉、光點飛向狐狸」那種秀氣的光點（一顆柔光、沒有尾巴、到了輕輕亮一下），只放大一點點（2026-11-13 CK）
var FXC=$('fx'),fxg=FXC.getContext('2d'),parts=[],fxOn=false,TRAVEL=0.65;   /* 光從珠子消掉那一刻起飛，約 0.65 秒後對方那份才收到 atk、台上的狐狸開始蓄力（再 0.45 秒打下去）：光到＝開始蓄力 */
var GLOW=[0xe8764c,0x439fe2,0x38b48a,0xe9bf48,0x8b6fe2,0xffd98a].map(function(c){   // 五種珠子的顏色往白色靠三成（跟遊戲的 typeColor 一樣）；每色一張柔光貼圖（漸層照遊戲的 glowTex）
  var r=Math.round((c>>16&255)*0.7+255*0.3),g=Math.round((c>>8&255)*0.7+255*0.3),b=Math.round((c&255)*0.7+255*0.3),cv=document.createElement('canvas');cv.width=cv.height=96;
  var x=cv.getContext('2d'),gr=x.createRadialGradient(48,48,0,48,48,48),rgb='rgba('+r+','+g+','+b+',';gr.addColorStop(0,rgb+'1)');gr.addColorStop(0.22,rgb+'.5)');gr.addColorStop(0.55,rgb+'.12)');gr.addColorStop(1,rgb+'0)');
  x.fillStyle=gr;x.fillRect(0,0,96,96);return cv;});
var MOTE_K=1.3;   // 比遊戲裡的光點大多少
function fxSize(){var r=Math.min(devicePixelRatio||1,2);FXC.width=innerWidth*r;FXC.height=innerHeight*r;fxg.setTransform(r,0,0,r,0,0);}addEventListener('resize',fxSize);fxSize();
function target(k){var o=k==='a'?'b':'a',p=(o==='a'?pa:pb).getBoundingClientRect(),g=side[o].geo;   // k 這邊的光飛到另一邊（o）畫面裡台上的狐狸
  return g&&g.avatar?{x:p.left+g.avatar.x,y:p.top+g.avatar.y}:{x:p.left+p.width/2,y:p.top+p.height*0.22};}
function fly(k,pts){var p=(k==='a'?pa:pb).getBoundingClientRect(),t=target(k),now=performance.now()/1000,g=side[k].geo,cs=g&&g.board?g.board.w/7:p.width/8.6;
  pts.forEach(function(q,i){var x0=p.left+q.x,y0=p.top+q.y;
    parts.push({x0:x0,y0:y0,cx:(x0+t.x)/2+(Math.random()-0.5)*cs*2.4,cy:Math.min(y0,t.y)-cs*(0.6+Math.random()*1.6),x1:t.x+(Math.random()-0.5)*cs*0.5,y1:t.y+(Math.random()-0.5)*cs*0.5,t0:now+i*0.03,img:GLOW[q.c]||GLOW[5],cs:cs});});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){var now=performance.now()/1000;fxg.clearRect(0,0,innerWidth,innerHeight);fxg.globalCompositeOperation='lighter';
  parts=parts.filter(function(q){var k=(now-q.t0)/TRAVEL;if(k<0)return true;if(k>1.28)return false;var sz;
    if(k<=1){var e=k*k*(3-2*k),u=1-e,x=u*u*q.x0+2*u*e*q.cx+e*e*q.x1,y=u*u*q.y0+2*u*e*q.cy+e*e*q.y1;sz=q.cs*(0.5-0.2*k)*MOTE_K*2;fxg.globalAlpha=1;fxg.drawImage(q.img,x-sz/2,y-sz/2,sz,sz);}
    else{var b=(k-1)/0.28;sz=q.cs*0.7*MOTE_K*2;fxg.globalAlpha=1-b;fxg.drawImage(q.img,q.x1-sz/2,q.y1-sz/2,sz,sz);}   /* 到了：輕輕亮一下就淡掉 */
    return true;});
  fxg.globalAlpha=1;fxg.globalCompositeOperation='source-over';if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fxg.clearRect(0,0,innerWidth,innerHeight);}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
setInterval(function(){var c=$('clock');if(state!=='play'){if(state==='wait'&&!linked)c.textContent='—';return;}
  if(document.hidden)return;var t=(performance.now()-t0-held)/1000;c.textContent=fmt(DEF.time-t);if(++tick%5===0)both({type:'clock',t:t});   /* 每秒對時一次（大招特寫、掉格會讓兩邊的時鐘慢慢差開） */
  c.classList.toggle('rage',t>=DEF.rage[0]);
  if(t>=DEF.time){var a=side.a.st,b=side.b.st,ka=a.ko||0,kb=b.ko||0,ra=(a.hp||0)/(a.max||1),rb=(b.hp||0)/(b.max||1);
    over(ka<kb?'a':kb<ka?'b':Math.abs(ra-rb)<1e-6?'draw':ra>rb?'a':'b','time');}},200);
draw();
window.__duel={fly:fly,danger:danger,ko:koShow,side:side,state:function(){return state;}};   // 測試用
if(Q.has('kotest')){var kb=document.createElement('button');kb.textContent='試 KO';kb.style.cssText='margin-top:8px;font:12px sans-serif;padding:4px 10px;border-radius:999px;border:1px solid #8a93c4;background:#1b2040;color:#fff;cursor:pointer';var kn=0;kb.onclick=function(){koShow(kn++%2?'a':'b');};mid.appendChild(kb);}   /* ?kotest：中間多一顆按鈕，先看 KO 大字、聽音效（輪流：我 KO 她＝金、我被 KO＝紅） */
})();
